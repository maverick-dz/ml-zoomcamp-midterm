name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-serve.txt
      - run: pip install -r requirements-serve.txt pytest==9.2.0 httpx==0.28.1
      - run: pytest -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t diabetes-predictor .
      - name: Smoke test the container
        run: |
          docker run -d --rm -p 9696:9696 --name svc diabetes-predictor
          for i in $(seq 1 20); do curl -sf localhost:9696/health && break || sleep 1; done
          curl -sf -X POST localhost:9696/predict -H "Content-Type: application/json" -d @sample_request.json
          docker stop svc
